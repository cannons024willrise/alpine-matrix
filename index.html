<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BASE</title>
<style>
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:monospace;color:#0f0}
canvas{display:block;image-rendering:pixelated}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));font-size:12px;line-height:1.5;z-index:10;pointer-events:none;text-shadow:1px 1px #000}
#hud.hidden{display:none}
#hudToggle{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:40px;height:40px;background:rgba(0,70,0,.5);border:2px solid #0f0;border-radius:4px;color:#0f0;font:700 14px monospace;cursor:pointer;pointer-events:auto;z-index:11;display:block}
#mobileControls{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}
#joystick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:118px;height:118px;border:2px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(0,0,0,.18);pointer-events:auto;touch-action:none}
#joystickKnob{position:absolute;left:39px;top:39px;width:36px;height:36px;border-radius:50%;background:rgba(220,240,225,.65);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#actionButton{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:82px;height:82px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(0,70,0,.38);color:#d8ffe0;font:700 15px monospace;pointer-events:auto;touch-action:none}
#craftButton{position:absolute;right:max(30px,env(safe-area-inset-right));bottom:max(122px,calc(env(safe-area-inset-bottom) + 94px));width:62px;height:62px;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(70,55,0,.45);color:#ffe9a8;font:700 11px monospace;pointer-events:auto;touch-action:none}
#craftHint{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font-size:11px;color:#0f0;background:rgba(0,0,0,.6);border:1px solid #0f0;border-radius:4px;padding:6px 10px;z-index:10;text-shadow:1px 1px #000}
@media (pointer:coarse), (max-width:700px){#mobileControls{display:block}#hud{font-size:11px}#craftHint{display:none}}
#craftPanel{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);align-items:center;justify-content:center}
#craftPanel.open{display:flex}
#craftPanelInner{width:min(420px,92vw);max-height:80vh;overflow-y:auto;background:rgba(6,14,6,.96);border:2px solid #0f0;border-radius:6px;padding:16px;font-family:monospace;color:#0f0}
#craftPanelInner h2{font-size:16px;margin-bottom:12px;letter-spacing:1px}
#craftClose{position:absolute;top:10px;right:12px;background:none;border:none;color:#0f0;font:700 18px monospace;cursor:pointer;pointer-events:auto}
.craftRecipe{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin-bottom:8px;border:1px solid rgba(0,255,0,.3);border-radius:4px;cursor:pointer;pointer-events:auto}
.craftRecipe.affordable{border-color:#0f0;background:rgba(0,255,0,.08)}
.craftRecipe.affordable:active{background:rgba(0,255,0,.22)}
.craftRecipe.locked{opacity:.45;cursor:default}
.craftRecipe .rName{font-weight:700;font-size:13px;margin-bottom:4px}
.craftRecipe .rCost{font-size:11px;color:#9f9}
.craftRecipe .rDesc{font-size:10px;color:#8a8;margin-top:4px;line-height:1.4;max-width:260px}
.craftRecipe .rHave{font-size:14px;font-weight:700;min-width:34px;text-align:center}
.craftStageLabel{font-size:11px;letter-spacing:1px;color:#ffd76a;margin:14px 0 8px;text-transform:uppercase}
.craftStageLabel:first-child{margin-top:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<button id="hudToggle" type="button">◆</button>
<div id="craftHint">[C] Crafting</div>
<div id="craftPanel"><div id="craftPanelInner" style="position:relative"><button id="craftClose" type="button">✕</button><h2>◆ CRAFTING ◆</h2><div id="craftList"></div></div></div>
<div id="mobileControls"><div id="joystick"><div id="joystickKnob"></div></div><button id="craftButton" type="button">CRAFT</button><button id="actionButton" type="button">ACT</button></div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
let W=innerWidth,H=innerHeight;
const touchMove={x:0,y:0,active:false};
let suppressNextClick=false;
canvas.width=W;canvas.height=H;
const TILE=32,SCALE=1;
let viewportCols=Math.ceil(W/TILE)+4,viewportRows=Math.ceil(H/TILE)+4;
let vignetteCanvas=null;
function buildVignette(){const vc=document.createElement('canvas');vc.width=W;vc.height=H;const c=vc.getContext('2d');const g=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=g;c.fillRect(0,0,W,H);vignetteCanvas=vc}buildVignette();
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H;viewportCols=Math.ceil(W/TILE)+4;viewportRows=Math.ceil(H/TILE)+4;buildVignette()});
addEventListener('orientationchange',()=>setTimeout(()=>dispatchEvent(new Event('resize')),100));
const LIGHT_DX=-.55,LIGHT_DY=-.8;
function hash(x,y,seed){let h=(x*374761393+y*668265263+seed*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h>>>0)%1000000)/1000000}
function noise(x,y,seed){const x0=Math.floor(x),y0=Math.floor(y),sx=x-x0,sy=y-y0,u=sx*sx*(3-2*sx),v=sy*sy*(3-2*sy);const n00=hash(x0,y0,seed),n10=hash(x0+1,y0,seed),n01=hash(x0,y0+1,seed),n11=hash(x0+1,y0+1,seed);return(n00+u*(n10-n00))+v*((n01+u*(n11-n01))-(n00+u*(n10-n00)))}
function mixColorRGB(a,b,t){const r1=parseInt(a.slice(1,3),16),g1=parseInt(a.slice(3,5),16),b1=parseInt(a.slice(5,7),16),r2=parseInt(b.slice(1,3),16),g2=parseInt(b.slice(3,5),16),b2=parseInt(b.slice(5,7),16);return[Math.round(r1+(r2-r1)*t),Math.round(g1+(g2-g1)*t),Math.round(b1+(b2-b1)*t)]}
function mixColor(a,b,t){const rgb=mixColorRGB(a,b,t);return`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`}
const SEED=Math.random()*1e9;
const tileCache=new Map(),treeEntityCache=new Map(),pebbleCache=new Map(),bigPebbleCache=new Map(),collectedBigPebbleCache=new Map(),bushEntityCache=new Map(),stickEntityCache=new Map(),collectedStickCache=new Map(),flintEntityCache=new Map(),collectedFlintCache=new Map(),charcoalEntityCache=new Map(),collectedCharcoalCache=new Map(),treeSpriteCache=new Map(),bushSpriteCache=new Map();
const MAX_PEBBLES=400,MAX_BIG_PEBBLES=100,MAX_BUSHES=180,MAX_STICKS=180,MAX_FLINT=90,MAX_CHARCOAL=140;
let frameCounter=0;
function trimCache(map,limit,count){if(map.size<=limit)return;const it=map.keys();for(let i=0;i<count;i++){const k=it.next().value;if(k===undefined)break;map.delete(k)}}
function getTile(x,y){const key=`${x},${y}`;let tile=tileCache.get(key);if(!tile){const shade=noise(x*.17,y*.17,SEED+300),elevation=noise(x*.015,y*.015,SEED+900),bedrock=noise(x*.05,y*.05,SEED+901),moisture=noise(x*.07,y*.07,SEED+902);const aspect=noise(x*.02,y*.02,SEED+920)*2-1;const adjustedElev=elevation+aspect*noise(x*.03,y*.03,SEED+910)*.15;let type;if(moisture>.72)type='gleysol';else if(adjustedElev>.68)type=bedrock>.5?'regosol':'alpineRanker';else if(adjustedElev>.45)type=bedrock>.6?'rendzina':'podzol';else type='brownEarth';tile={type,shade,elevation:adjustedElev,aspect};trimCache(tileCache,10000,1000);tileCache.set(key,tile)}return tile}
const SOIL_DEFS={
  brownEarth:{name:'Brown Earth',dark:'#1f4620',light:'#3c7a3f',vegetated:true,blade:['#5bc46a','#3a7a42']},
  podzol:{name:'Podzol',dark:'#17321f',light:'#357a56',vegetated:true,blade:['#5cb37a','#2f6b4a']},
  gleysol:{name:'Gleysol',dark:'#173636',light:'#2f6a62',vegetated:true,blade:['#5cb3a8','#2f6b62']},
  alpineRanker:{name:'Alpine Ranker',dark:'#453f34',light:'#6e6552',vegetated:false},
  regosol:{name:'Regosol',dark:'#8c8478',light:'#bcb2a0',vegetated:false},
  rendzina:{name:'Rendzina',dark:'#a89a78',light:'#d8cba8',vegetated:false}
};
const SOIL_TYPES=Object.keys(SOIL_DEFS),PALETTE_STEPS=8,SOIL_PALETTES={},SOIL_PALETTES_RGB={},BIOME_BLEND_RADIUS=2;
for(const type of SOIL_TYPES){const def=SOIL_DEFS[type],arr=[],arrRgb=[];for(let i=0;i<=PALETTE_STEPS;i++){const rgb=mixColorRGB(def.dark,def.light,i/PALETTE_STEPS);arrRgb.push(rgb);arr.push(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`)}SOIL_PALETTES[type]=arr;SOIL_PALETTES_RGB[type]=arrRgb}
function getBlendedTileColor(tx,ty){let r=0,g=0,b=0,n=0;for(let dy=-BIOME_BLEND_RADIUS;dy<=BIOME_BLEND_RADIUS;dy++)for(let dx=-BIOME_BLEND_RADIUS;dx<=BIOME_BLEND_RADIUS;dx++){const t=getTile(tx+dx,ty+dy),idx=Math.min(PALETTE_STEPS,Math.floor(t.shade*PALETTE_STEPS)),rgb=(SOIL_PALETTES_RGB[t.type]||SOIL_PALETTES_RGB.brownEarth)[idx];r+=rgb[0];g+=rgb[1];b+=rgb[2];n++}return`rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`}
function isVegetated(type){const d=SOIL_DEFS[type];return!!d&&d.vegetated}
function isBare(type){const d=SOIL_DEFS[type];return!!d&&!d.vegetated}

const entities=[];let nextId=0;
const floatingTexts=[];
const waterCache=new Map();
function getWater(x,y){const key=`${x},${y}`;let water=waterCache.get(key);if(!water){const tile=getTile(x,y);const isGleysol=tile.type==='gleysol';const riverNoise=noise(x*.04,y*.04,SEED+1100),riverFlow=noise(x*.02,y*.02,SEED+1101);const isRiver=riverNoise>.68&&riverFlow>Math.abs(noise(x*.03,y*.03,SEED+1102)-.5);water={gleysol:isGleysol,river:isRiver,flowDir:Math.atan2(riverFlow-.5,riverNoise-.5)};trimCache(waterCache,8000,800);waterCache.set(key,water)}return water}
function createFloatingText(x,y,text,color='#0f0'){floatingTexts.push({x,y,text,color,age:0,life:1.2})}
function createEntity(type,x,y,data={}){const e={id:nextId++,type,x,y,vx:0,vy:0,hp:type==='zombie'?30:100,animPhase:0,...data};if(type==='zombie')e.colorSeed=Math.random();entities.push(e);return e}
let cameraShake={intensity:0,duration:0};
function addCameraShake(intensity,duration){cameraShake.intensity=Math.max(cameraShake.intensity,intensity);cameraShake.duration=Math.max(cameraShake.duration,duration)}

function treeShouldSpawn(tx,ty){const tile=getTile(tx,ty),water=getWater(tx,ty);if(tile.type==='gleysol'||water.gleysol||water.river)return false;if(!isVegetated(tile.type))return false;const treelimit=0.50+tile.aspect*0.04;if(tile.elevation>treelimit)return false;const treeDensity=noise(tx*.12,ty*.12,SEED+500),spacing=hash(tx,ty,803);return treeDensity>.62&&spacing>.5}
function getTreePlacement(tx,ty){const ox=(hash(tx,ty,801)-.5)*TILE*.6,oy=(hash(tx,ty,802)-.5)*TILE*.6;return{x:tx+.5+ox/TILE,y:ty+.5+oy/TILE}}
function generateTreeEntityForTile(tx,ty){const key=`${tx},${ty}`;if(treeEntityCache.has(key))return;if(!treeShouldSpawn(tx,ty)){treeEntityCache.set(key,true);return}const pos=getTreePlacement(tx,ty);createEntity('tree',pos.x,pos.y,{seedVal:Math.floor(hash(tx,ty,999)*100000),radius:.25,tileX:tx,tileY:ty,solid:true,stickHarvested:false,stickYield:1+(hash(tx,ty,1001)>.68?1:0)});treeEntityCache.set(key,true)}

function generateBushEntityForTile(tx,ty){const key=`${tx},${ty}`;if(bushEntityCache.has(key))return;const tile=getTile(tx,ty),water=getWater(tx,ty);if(!isVegetated(tile.type)||water.river){bushEntityCache.set(key,true);return}const treelimit=0.50+tile.aspect*0.04;const inEcotone=tile.elevation>treelimit&&tile.elevation<treelimit+0.12;const density=noise(tx*.11,ty*.11,SEED+610),edge=noise(tx*.07,ty*.07,SEED+611),place=hash(tx,ty,612);const spawn=(inEcotone&&place>.4)||(density>.54&&place>.56&&tile.elevation<=treelimit-0.05)||(edge>.7&&place>.68);if(!spawn){bushEntityCache.set(key,true);return}const ox=(hash(tx,ty,613)-.5)*TILE*.75,oy=(hash(tx,ty,614)-.5)*TILE*.75;createEntity('bush',tx+.5+ox/TILE,ty+.5+oy/TILE,{tileX:tx,tileY:ty,radius:.22,seedVal:Math.floor(hash(tx,ty,615)*100000),fiberYield:2+Math.floor(hash(tx,ty,616)*4),harvested:false,regrowAt:0});bushEntityCache.set(key,true)}

function generateStickEntityForTile(tx,ty){const key=`${tx},${ty}`;if(stickEntityCache.has(key)||collectedStickCache.has(key))return;
  if(!treeShouldSpawn(tx,ty)||hash(tx,ty,741)>.28){stickEntityCache.set(key,true);return}
  const treePos=getTreePlacement(tx,ty);
  const angle=(hash(tx,ty,742)-.5)*Math.PI*2;
  const distance=.16+hash(tx,ty,743)*.28;
  const x=treePos.x+Math.cos(angle)*distance;
  const y=treePos.y+Math.sin(angle)*distance*.65;
  createEntity('stick',x,y,{tileX:tx,tileY:ty,radius:.16,seedVal:Math.floor(hash(tx,ty,744)*100000),length:.62+hash(tx,ty,745)*.30,angle:(hash(tx,ty,746)-.5)*Math.PI,thick:true,collected:false});
  stickEntityCache.set(key,true)}

function generateFlintForTile(tx,ty){const key=`${tx},${ty}`;if(flintEntityCache.has(key)||collectedFlintCache.has(key))return;const tile=getTile(tx,ty),water=getWater(tx,ty);const regionX=Math.floor(tx/3),regionY=Math.floor(ty/3);const regionHasFlint=hash(regionX,regionY,861)<0.15;const regionCellX=regionX*3+Math.floor(hash(regionX,regionY,865)*3);const regionCellY=regionY*3+Math.floor(hash(regionX,regionY,866)*3);if(!isBare(tile.type)||water.river||!regionHasFlint||tx!==regionCellX||ty!==regionCellY){flintEntityCache.set(key,true);return}const x=tx+.15+hash(tx,ty,862)*.7,y=ty+.15+hash(tx,ty,863)*.7;createEntity('flint',x,y,{tileX:tx,tileY:ty,radius:.13,seedVal:Math.floor(hash(tx,ty,864)*100000),sharp:true,collected:false});flintEntityCache.set(key,true)}

function generateCharcoalForTile(tx,ty){const key=`${tx},${ty}`;if(charcoalEntityCache.has(key)||collectedCharcoalCache.has(key))return;const tile=getTile(tx,ty),water=getWater(tx,ty);if(water.river){charcoalEntityCache.set(key,true);return}const hasCharcoal=hash(tx,ty,922)<0.12;if(!hasCharcoal){charcoalEntityCache.set(key,true);return}const x=tx+.2+hash(tx,ty,923)*.6,y=ty+.2+hash(tx,ty,924)*.6;createEntity('charcoal',x,y,{tileX:tx,tileY:ty,radius:.12,seedVal:Math.floor(hash(tx,ty,925)*100000),collected:false});charcoalEntityCache.set(key,true)}

function generatePebblesForTile(tx,ty){const key=`${tx},${ty}`;if(pebbleCache.has(key))return;const tile=getTile(tx,ty),water=getWater(tx,ty);if(!isBare(tile.type)||water.river){pebbleCache.set(key,true);return}const count=Math.floor(hash(tx,ty,850)*2.5)+1;for(let i=0;i<count;i++){const s=851+i*5,r=.08+hash(tx,ty,s+2)*.08,lx=hash(tx,ty,s)*(1-r*2)+r,ly=hash(tx,ty,s+1)*(1-r*2)+r;createEntity('pebble',tx+lx,ty+ly,{radius:r,tone:hash(tx,ty,s+3),light:hash(tx,ty,s+4),tileX:tx,tileY:ty,seed:Math.floor(hash(tx,ty,s+6)*100000)})}pebbleCache.set(key,true)}

function generateBigPebbleForTile(tx,ty){const key=`${tx},${ty}`;if(bigPebbleCache.has(key)||collectedBigPebbleCache.has(key))return;const tile=getTile(tx,ty),water=getWater(tx,ty);if(!isBare(tile.type)||water.river){bigPebbleCache.set(key,true);return}if(hash(tx,ty,860)>.34){bigPebbleCache.set(key,true);return}const r=.16+hash(tx,ty,861)*.06;const lx=r+hash(tx,ty,862)*(1-r*2),ly=r+hash(tx,ty,863)*(1-r*2);createEntity('bigPebble',tx+lx,ty+ly,{radius:r,tone:hash(tx,ty,864),light:hash(tx,ty,865),tileX:tx,tileY:ty,seed:Math.floor(hash(tx,ty,866)*100000),collected:false});bigPebbleCache.set(key,true)}

function buildTileBackground(tx,ty,tileData){const def=SOIL_DEFS[tileData.type]||SOIL_DEFS.brownEarth;const bg=document.createElement('canvas');bg.width=TILE;bg.height=TILE;const c=bg.getContext('2d');c.fillStyle=getBlendedTileColor(tx,ty);c.fillRect(0,0,TILE,TILE);if(def.vegetated){const[bladeLight,bladeDark]=def.blade;const count=Math.floor(hash(tx,ty,1)*6)+6;tileData.grassPattern=[];for(let i=0;i<count;i++){const blade={x:hash(tx,ty,i*2+101),y:hash(tx,ty,i*2+102),offsetSway:i%3-1,light:hash(tx,ty,i*2+103)>.5};tileData.grassPattern.push(blade);const gx=Math.floor(blade.x*(TILE-2*SCALE)),gy=Math.floor(blade.y*(TILE-8*SCALE)+4*SCALE);c.fillStyle=blade.light?bladeLight:bladeDark;c.fillRect(gx,gy+2,2,3)}if(hash(tx,ty,777)>.94){const fx=Math.floor(hash(tx,ty,778)*(TILE-4)+2),fy=Math.floor(hash(tx,ty,779)*(TILE-4)+2);c.fillStyle=hash(tx,ty,780)>.5?'#f2e26b':'#f0f0f0';c.fillRect(fx,fy,2,2)}}else{const count=Math.floor(hash(tx,ty,790)*8)+5;for(let i=0;i<count;i++){const s=791+i*3,px=Math.floor(hash(tx,ty,s)*TILE),py=Math.floor(hash(tx,ty,s+1)*TILE),t=hash(tx,ty,s+2);c.fillStyle=t>.75?'rgba(230,225,215,.55)':t>.5?'rgba(170,165,155,.5)':t>.25?'rgba(130,125,115,.5)':'rgba(90,85,75,.45)';c.beginPath();c.arc(px+.5,py+.5,.75,0,Math.PI*2);c.fill()}}tileData.bgCanvas=bg}

const TIER_COLORS=[{dark:'#0a2810',light:'#1e5a2a'},{dark:'#0f3215',light:'#2a6a35'},{dark:'#1a4020',light:'#357a45'},{dark:'#2a5030',light:'#4a8a55'}];
function drawPineTreeRaw(c,x,y,seed,scale){const trunkW=Math.max(2,Math.floor(2.5*scale)),trunkH=Math.floor(24*scale);c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x-LIGHT_DX*8,y+2,18*scale,8*scale,0,0,Math.PI*2);c.fill();const tx=Math.floor(x-trunkW/2),top=Math.floor(y-trunkH),lit=Math.max(1,Math.floor(trunkW*.55));c.fillStyle='#5a4a2a';c.fillRect(tx,top,lit,trunkH);c.fillStyle='#1a0e08';c.fillRect(tx+lit,top,trunkW-lit,trunkH);let cy=y-trunkH+8;for(let t=0;t<8;t++){const tw=Math.floor((32-t*4.5)*scale),th=Math.floor((11-t*.5)*scale),sh=Math.max(1,Math.floor(th/6)),col=TIER_COLORS[Math.min(t,3)];for(let s=0;s<6;s++){const sw=Math.floor(tw*(1-(s/6)*.75)),j=Math.floor((hash(seed,t*10+s,t)-.5)*3),rx=Math.floor(x-sw/2)+j,ry=Math.floor(cy-(s+1)*sh),lw=Math.max(1,Math.floor(sw*.55));c.fillStyle=col.light;c.fillRect(rx,ry,lw,sh);c.fillStyle=col.dark;c.fillRect(rx+lw,ry,Math.max(1,sw-lw),sh)}cy-=Math.floor(th*.5)}}
function getTreeSprite(seed){let s=treeSpriteCache.get(seed);if(s)return s;const tc=document.createElement('canvas');tc.width=160;tc.height=160;drawPineTreeRaw(tc.getContext('2d'),80,130,seed,.9+hash(seed,1,10)*.5);s={canvas:tc};treeSpriteCache.set(seed,s);trimCache(treeSpriteCache,2000,500);return s}

function drawBushRaw(c,x,y,seed){const sc=1+hash(seed,1,51)*.35;c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(x,y+5,15*sc,5*sc,0,0,Math.PI*2);c.fill();c.strokeStyle='#3b3225';c.lineWidth=2;c.beginPath();c.moveTo(x-7*sc,y+3);c.lineTo(x-3*sc,y-9*sc);c.moveTo(x,y+3);c.lineTo(x+1*sc,y-12*sc);c.moveTo(x+7*sc,y+3);c.lineTo(x+5*sc,y-8*sc);c.stroke();const leaves=['#214c27','#2e6631','#3f7f3d','#315f35'];for(let i=0;i<14;i++){const a=hash(seed,i,70)*Math.PI*2,r=3+hash(seed,i+100,71)*10,lx=x+Math.cos(a)*r,ly=y-5*sc+Math.sin(a)*r*.45;c.fillStyle=leaves[Math.floor(hash(seed,i+200,72)*leaves.length)];c.beginPath();c.arc(lx,ly,2.5+hash(seed,i+300,73)*2.2,0,Math.PI*2);c.fill()}}
function getBushSprite(seed){let s=bushSpriteCache.get(seed);if(s)return s;const bc=document.createElement('canvas');bc.width=64;bc.height=64;drawBushRaw(bc.getContext('2d'),32,43,seed);s={canvas:bc};bushSpriteCache.set(seed,s);trimCache(bushSpriteCache,1200,250);return s}

function screenToWorld(x,y){const r=canvas.getBoundingClientRect();const sx=x-r.left,sy=y-r.top;return{x:sx/TILE+(player.x-viewportCols/2),y:sy/TILE+(player.y-viewportRows/2)}}
function addItem(name,amount){player.inventory[name]=(player.inventory[name]||0)+amount}
function harvestBush(e){if(!e||e.type!=='bush'||e.harvested)return;e.harvested=true;e.clicked=true;addItem('fiber',e.fiberYield);e.regrowAt=performance.now()+15000;setTimeout(()=>e.clicked=false,200)}
function harvestTreeForSticks(e){if(!e||e.type!=='tree'||e.stickHarvested)return;e.stickHarvested=true;e.clicked=true;const yield_=e.stickYield||1;addItem('thickStick',yield_);createFloatingText(e.x,e.y-1,`◆ Stick ×${yield_}`,'#8f8');addCameraShake(.15,.35);setTimeout(()=>e.clicked=false,450)}
function worldToScreenPoint(x,y){return{x:(x-player.x+viewportCols/2)*TILE+TILE/2,y:(y-player.y+viewportRows/2)*TILE+TILE/2}}

function screenPointForEntity(ent){
  return {
    x:(ent.x-player.x+viewportCols/2)*TILE+TILE/2,
    y:(ent.y-player.y+viewportRows/2)*TILE+TILE/2
  };
}

function pointToSegmentDistance(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const lenSq=dx*dx+dy*dy;
  if(lenSq===0)return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/lenSq;
  t=Math.max(0,Math.min(1,t));
  const qx=x1+t*dx,qy=y1+t*dy;
  return Math.hypot(px-qx,py-qy);
}

function hitEntityAtScreen(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  const x=clientX-rect.left,y=clientY-rect.top;
  let best=null,bestScore=Infinity,bestPriority=-1;

  for(const ent of entities){
    if(ent.type!=='bigPebble'&&ent.type!=='tree'&&ent.type!=='bush'&&ent.type!=='stick'&&ent.type!=='flint'&&ent.type!=='charcoal')continue;
    if((ent.type==='flint'||ent.type==='bigPebble'||ent.type==='stick'||ent.type==='charcoal')&&ent.collected)continue;

    const p=screenPointForEntity(ent);
    let distance;

    if(ent.type==='stick'){
      const half=(ent.length*TILE)/2;
      const dx=Math.cos(ent.angle)*half;
      const dy=Math.sin(ent.angle)*half;
      distance=pointToSegmentDistance(x,y,p.x-dx,p.y-dy,p.x+dx,p.y+dy);
    }else{
      distance=Math.hypot(x-p.x,y-p.y);
    }

    const radius=ent.type==='stick'?46:ent.type==='bigPebble'?34:ent.type==='flint'?34:ent.type==='charcoal'?32:ent.type==='tree'?88:ent.type==='bush'?40:30;
    if(distance>radius)continue;

    const priority=ent.type==='stick'?3:ent.type==='bigPebble'?2.8:ent.type==='flint'?2.5:ent.type==='charcoal'?2.5:ent.type==='tree'?2.2:ent.type==='bush'?2:0;
    const score=distance-(priority*4);
    if(score<bestScore){
      best=ent;
      bestScore=score;
      bestPriority=priority;
    }
  }

  if(!best)return null;
  player.target=best;
  best.clicked=true;
  setTimeout(()=>best.clicked=false,200);
  return best;
}

function canAfford(cost){for(const k in cost)if((player.inventory[k]||0)<cost[k])return false;return true}
function craftItem(id){
  const recipe=RECIPES.find(r=>r.id===id);
  if(!recipe||!canAfford(recipe.cost))return false;
  if(recipe.requiresCampfire&&player.campfires.length===0)return false;
  if(recipe.buildable){
    player.placingRecipeId=id;
    closeCraftPanel();
    createFloatingText(player.x,player.y-1,`Click world to place ${recipe.name}`,'#ffd76a');
    return true;
  }
  for(const k in recipe.cost)player.inventory[k]-=recipe.cost[k];
  addItem(id,1);
  createFloatingText(player.x,player.y-1,`◆ ${recipe.name}`,'#ffd76a');
  addCameraShake(.08,.2);
  renderCraftPanel();
  return true;
}
const craftPanel=document.getElementById('craftPanel');
const craftList=document.getElementById('craftList');
function renderCraftPanel(){
  const stages=['Build','Process','Haft'];
  let campfireSelector='';
  if(player.campfires.length>0){
    campfireSelector=`<div style="background:rgba(232,160,64,.15);padding:10px;margin-bottom:12px;border:1px solid #e8a040;border-radius:4px"><div style="font-size:11px;color:#fb2;margin-bottom:6px">SELECT CAMPFIRE:</div>${player.campfires.map((cf,i)=>`<div style="font-size:10px;color:#ccc;margin:4px 0;cursor:pointer;padding:4px;background:${player.selectedCampfire===i?'rgba(232,160,64,.3)':'transparent'};border:1px solid ${player.selectedCampfire===i?'#e8a040':'transparent'};border-radius:2px" onclick="player.selectedCampfire=${i};renderCraftPanel()">${i+1}. (${Math.round(cf.x)}, ${Math.round(cf.y)}) ⚡${Math.ceil(cf.fuel)}</div>`).join('')}</div>`;
  }
  craftList.innerHTML=campfireSelector+stages.map(stage=>{
    const rows=RECIPES.filter(r=>r.stage===stage).map(r=>{
      const afford=canAfford(r.cost);
      const canCraft=afford&&(!r.requiresCampfire||player.campfires.length>0);
      const costStr=Object.entries(r.cost).map(([k,v])=>{
        const have=player.inventory[k]||0;
        const short=have<v;
        return `<span style="color:${short?'#f66':'#9f9'}">${v} ${k}${short?` (have ${have})`:''}</span>`;
      }).join(', ');
      const have=player.inventory[r.id]||0;
      const warning=r.requiresCampfire&&player.campfires.length===0?'<div style="font-size:10px;color:#f99;margin-top:4px">⚠ Requires campfire</div>':'';
      const campfireStatus=r.buildable&&player.campfires.length>0?`<div style="font-size:10px;color:#fb2;margin-top:4px">🔥 ${player.campfires.length} campfire(s)</div>`:'';
      return `<div class="craftRecipe ${canCraft?'affordable':'locked'}" data-id="${r.id}">
        <div><div class="rName">${r.name}</div><div class="rCost">${costStr}</div><div class="rDesc">${r.desc}</div>${warning}${campfireStatus}</div>
        <div class="rHave">${have}</div>
      </div>`;
    }).join('');
    const stageName=stage==='Build'?'🏗 Build':stage==='Process'?'① Process Raw Materials':'② Haft Finished Tools';
    return `<div class="craftStageLabel">${stageName}</div>${rows}`;
  }).join('');
}
function openCraftPanel(){renderCraftPanel();craftPanel.classList.add('open')}

const COLLECTION_RANGE=2.5;
function interactTarget(){
  if(player.target){
    const t=player.target;
    if(t.type==='tree'&&!t.stickHarvested){harvestTreeForSticks(t);return}
    if(t.type==='bush'&&!t.harvested){harvestBush(t);return}
    if(t.type==='stick'&&!t.collected){t.collected=true;addItem('thickStick',1);createFloatingText(t.x,t.y-0.5,'◆ Stick','#8f8');const stickKey=`${t.tileX},${t.tileY}`;stickEntityCache.delete(stickKey);collectedStickCache.set(stickKey,true);return}
    if(t.type==='flint'&&!t.collected){t.collected=true;addItem('flint',1);createFloatingText(t.x,t.y-0.5,'◆ Flint','#fff');const flintKey=`${t.tileX},${t.tileY}`;flintEntityCache.delete(flintKey);collectedFlintCache.set(flintKey,true);return}
    if(t.type==='bigPebble'&&!t.collected){t.collected=true;addItem('bigPebble',1);createFloatingText(t.x,t.y-0.5,'◆ Pebble','#ffd');const pebbleKey=`${t.tileX},${t.tileY}`;bigPebbleCache.delete(pebbleKey);collectedBigPebbleCache.set(pebbleKey,true);return}
  }else{
    for(const e of entities){
      if(e.type==='bigPebble'||e.type==='flint'||e.type==='charcoal'||e.type==='stick'){
        const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
        if(d<COLLECTION_RANGE&&!e.collected){
          player.target=e;
          e.clicked=true;
          setTimeout(()=>e.clicked=false,200);
          if(e.type==='bigPebble'){e.collected=true;addItem('bigPebble',1);createFloatingText(e.x,e.y-0.5,'◆ Pebble','#ffd');const pebbleKey=`${e.tileX},${e.tileY}`;bigPebbleCache.delete(pebbleKey);collectedBigPebbleCache.set(pebbleKey,true);return}
          if(e.type==='flint'){e.collected=true;addItem('flint',1);createFloatingText(e.x,e.y-0.5,'◆ Flint','#fff');const flintKey=`${e.tileX},${e.tileY}`;flintEntityCache.delete(flintKey);collectedFlintCache.set(flintKey,true);return}
          if(e.type==='charcoal'){e.collected=true;addItem('charcoal',1);createFloatingText(e.x,e.y-0.5,'◆ Charcoal','#d8d8d8');const charcoalKey=`${e.tileX},${e.tileY}`;charcoalEntityCache.delete(charcoalKey);collectedCharcoalCache.set(charcoalKey,true);return}
          if(e.type==='stick'){e.collected=true;addItem('thickStick',1);createFloatingText(e.x,e.y-0.5,'◆ Stick','#8f8');const stickKey=`${e.tileX},${e.tileY}`;stickEntityCache.delete(stickKey);collectedStickCache.set(stickKey,true);return}
        }
      }
    }
  }
}

addEventListener('click',e=>{
  if(suppressNextClick){suppressNextClick=false;return}
  if(player.placingRecipeId){
    const recipe=RECIPES.find(r=>r.id===player.placingRecipeId);
    if(recipe&&canAfford(recipe.cost)){
      for(const k in recipe.cost)player.inventory[k]-=recipe.cost[k];
      const world=screenToWorld(e.clientX,e.clientY);
      if(recipe.id==='campfire'){
        player.campfires.push({x:world.x,y:world.y,fuel:3,createdAt:performance.now()});
        createFloatingText(world.x,world.y-1,'◆ Campfire','#e8a040');
      }
      addCameraShake(.1,.3);
    }
    player.placingRecipeId=null;
    return;
  }
  const hit=hitEntityAtScreen(e.clientX,e.clientY);
  if(hit)interactTarget();
});

const joystick=document.getElementById('joystick');
const joystickKnob=document.getElementById('joystickKnob');
const actionButton=document.getElementById('actionButton');
let joystickPointer=null;
function updateJoystick(clientX,clientY){
  const r=joystick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy;
  const max=38,dist=Math.hypot(dx,dy);
  if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
  touchMove.x=dx/max;touchMove.y=dy/max;
  joystickKnob.style.transform=`translate(${dx}px,${dy}px)`;
}
function resetJoystick(){touchMove.x=0;touchMove.y=0;touchMove.active=false;joystickKnob.style.transform='translate(0px,0px)';joystickPointer=null}
joystick.addEventListener('pointerdown',e=>{joystickPointer=e.pointerId;touchMove.active=true;joystick.setPointerCapture(e.pointerId);updateJoystick(e.clientX,e.clientY);e.preventDefault()});
joystick.addEventListener('pointermove',e=>{if(e.pointerId===joystickPointer)updateJoystick(e.clientX,e.clientY);e.preventDefault()});
joystick.addEventListener('pointerup',e=>{if(e.pointerId===joystickPointer)resetJoystick();e.preventDefault()});
joystick.addEventListener('pointercancel',resetJoystick);
actionButton.addEventListener('pointerdown',e=>{interactTarget();actionButton.textContent='OK';setTimeout(()=>actionButton.textContent='ACT',120);e.preventDefault()});

canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    suppressNextClick=true;
    if(player.placingRecipeId){
      const recipe=RECIPES.find(r=>r.id===player.placingRecipeId);
      if(recipe&&canAfford(recipe.cost)){
        for(const k in recipe.cost)player.inventory[k]-=recipe.cost[k];
        const world=screenToWorld(e.clientX,e.clientY);
        if(recipe.id==='campfire'){
          player.campfires.push({x:world.x,y:world.y,fuel:3,createdAt:performance.now()});
          createFloatingText(world.x,world.y-1,'◆ Campfire','#e8a040');
        }
        addCameraShake(.1,.3);
      }
      player.placingRecipeId=null;
      e.preventDefault();
      return;
    }
    const hit=hitEntityAtScreen(e.clientX,e.clientY);
    if(hit)interactTarget();
    e.preventDefault();
  }
},{passive:false});

function cullFarEntities(){let count=0;for(const e of entities)if(e.type==='pebble'||e.type==='tree'||e.type==='bush'||e.type==='stick'||e.type==='flint'||e.type==='charcoal')count++;const limit=MAX_BIG_PEBBLES+MAX_BUSHES+MAX_STICKS+MAX_FLINT+MAX_CHARCOAL;if(count<=limit)return;const arr=[];for(let i=0;i<entities.length;i++){const e=entities[i];if(!['bigPebble','tree','bush','stick','flint','charcoal'].includes(e.type))continue;const dx=e.x-player.x,dy=e.y-player.y;arr.push({i,d:dx*dx+dy*dy,e})}arr.sort((a,b)=>b.d-a.d);const remove=new Set();for(let i=0;i<Math.max(0,arr.length-limit);i++){const x=arr[i];remove.add(x.i);const k=`${x.e.tileX},${x.e.tileY}`;if(x.e.type==='pebble')pebbleCache.delete(k);else if(x.e.type==='tree')treeEntityCache.delete(k);else if(x.e.type==='bush')bushEntityCache.delete(k);else if(x.e.type==='stick')stickEntityCache.delete(k);else if(x.e.type==='flint')flintEntityCache.delete(k);else if(x.e.type==='charcoal')charcoalEntityCache.delete(k)}for(let i=entities.length-1;i>=0;i--)if(remove.has(i))entities.splice(i,1)}

function update(dt){cameraShake.duration=Math.max(0,cameraShake.duration-dt);if(cameraShake.duration<=0)cameraShake.intensity=0;for(let i=floatingTexts.length-1;i>=0;i--){floatingTexts[i].age+=dt;if(floatingTexts[i].age>floatingTexts[i].life)floatingTexts.splice(i,1)}
for(let i=player.campfires.length-1;i>=0;i--){player.campfires[i].fuel-=dt/1000/60;if(player.campfires[i].fuel<=0)player.campfires.splice(i,1)}const cols=viewportCols,rows=viewportRows,sx0=Math.floor(player.x-cols/2),sy0=Math.floor(player.y-rows/2);for(let ty=sy0-2;ty<sy0+rows+2;ty++)for(let tx=sx0-2;tx<sx0+cols+2;tx++){generatePebblesForTile(tx,ty);generateBigPebbleForTile(tx,ty);generateTreeEntityForTile(tx,ty);generateBushEntityForTile(tx,ty);generateStickEntityForTile(tx,ty);generateFlintForTile(tx,ty)}player.vx=player.vy=0;const mobileX=touchMove.active?touchMove.x:0,mobileY=touchMove.active?touchMove.y:0;if(keys.w||keys.W||keys.ArrowUp)player.vy-=player.speed;if(keys.s||keys.S||keys.ArrowDown)player.vy+=player.speed;if(keys.a||keys.A||keys.ArrowLeft)player.vx-=player.speed;if(keys.d||keys.D||keys.ArrowRight)player.vx+=player.speed;player.vx+=mobileX*player.speed;player.vy+=mobileY*player.speed;player.moving=player.vx!==0||player.vy!==0;if(player.moving){player.facingAngle=Math.atan2(player.vy,player.vx);player.animPhase=(player.animPhase+dt*.045)%1}const nextX=player.x+player.vx,nextY=player.y+player.vy;const nextWater=getWater(Math.floor(nextX),Math.floor(nextY));if(!nextWater.river){player.x=nextX;player.y=nextY}else{player.vx=player.vy=0}for(const e of entities){if(e.type==='tree'&&e.solid){const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy),min=player.radius+e.radius;if(d<min&&d>.001){const push=min-d+.01,a=Math.atan2(dy,dx);player.x+=Math.cos(a)*push;player.y+=Math.sin(a)*push}}if(e.type==='bush'&&e.harvested&&performance.now()>=e.regrowAt){e.harvested=false;e.regrowAt=0}}frameCounter=(frameCounter+1)%30;if(frameCounter===0)cullFarEntities();for(const e of entities)if(e.type==='zombie'){const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);if(d<10){if(d>.1){e.vx=dx/d*.08;e.vy=dy/d*.08}e.aware=true}else{e.vx=e.vy=0;e.aware=false}e.x+=e.vx;e.y+=e.vy;if(e.vx||e.vy)e.animPhase=(e.animPhase+dt*.04)%1;else e.animPhase=0}}

const TREE_SORT_BASE_OFFSET=2.05;
function treeSortY(e){return e.y+TREE_SORT_BASE_OFFSET}

function render(){ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const shakeX=cameraShake.intensity>0?((Math.random()-.5)*cameraShake.intensity*TILE):0,shakeY=cameraShake.intensity>0?((Math.random()-.5)*cameraShake.intensity*TILE):0;ctx.translate(shakeX,shakeY);const cx=player.x,cy=player.y,cols=viewportCols,rows=viewportRows,sx0=Math.floor(cx-cols/2),sy0=Math.floor(cy-rows/2),time=Date.now()*.003;for(let ty=sy0;ty<sy0+rows;ty++)for(let tx=sx0;tx<sx0+cols;tx++){const tile=getTile(tx,ty);if(!tile.bgCanvas)buildTileBackground(tx,ty,tile);const sx=Math.floor((tx-cx+cols/2)*TILE),sy=Math.floor((ty-cy+rows/2)*TILE);ctx.drawImage(tile.bgCanvas,sx,sy);if(tile.type==='grass'&&tile.grassPattern){const sway=Math.sin(time+tx*.3+ty*.3)*3;for(const b of tile.grassPattern){const gx=Math.floor(sx+b.x*(TILE-2)),gy=Math.floor(sy+b.y*(TILE-8)+4),bend=Math.floor(sway+b.offsetSway);ctx.fillStyle=b.light?'#5bc46a':'#3a7a42';ctx.fillRect(gx+bend,gy-2,2,2)}}const water=getWater(tx,ty);if(water.river){const wavePhase=(time*2+tx*.2+ty*.2)%Math.PI*2;ctx.fillStyle='rgba(41,108,178,.7)';ctx.fillRect(sx,sy,TILE,TILE);ctx.strokeStyle='rgba(70,160,220,.5)';ctx.lineWidth=1;for(let i=0;i<3;i++){const offset=Math.sin(wavePhase+i)*2;ctx.beginPath();ctx.moveTo(sx,sy+TILE/3*(i+1)+offset);ctx.lineTo(sx+TILE,sy+TILE/3*(i+1)+offset);ctx.stroke()}}else if(water.gleysol){ctx.fillStyle='rgba(41,130,160,.4)';ctx.fillRect(sx,sy,TILE,TILE);const bubbles=Math.floor(hash(tx,ty,1200)*4)+1;for(let i=0;i<bubbles;i++){const bx=hash(tx,ty,1201+i*2)*TILE,by=hash(tx,ty,1202+i*2)*TILE,br=1+hash(tx,ty,1203+i*2)*1.5;ctx.fillStyle=`rgba(100,180,200,${.3+hash(tx,ty,1204+i*2)*.3})`;ctx.beginPath();ctx.arc(sx+bx,sy+by,br,0,Math.PI*2);ctx.fill()}}}
const draw=[];for(const e of entities){const sx=Math.floor((e.x-cx+cols/2)*TILE),sy=Math.floor((e.y-cy+rows/2)*TILE);if(e.type==='zombie')draw.push({y:e.y,render:()=>{if(e.aware){ctx.save();ctx.strokeStyle='#f00';ctx.globalAlpha=.22+Math.sin(Date.now()*.004)*.06;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx+TILE/2,sy+TILE/2,10,0,Math.PI*2);ctx.stroke();ctx.restore()}const sp=currentZombieSprite(e),size=TILE*1.7;if(sp.complete&&sp.naturalWidth){ctx.drawImage(sp,Math.floor(sx+TILE/2-size/2),Math.floor(sy+TILE/2-size/2),size,size)}else{ctx.fillStyle=e.aware?'#f00':'#600';ctx.fillRect(sx+4,sy+4,TILE-8,TILE-8)}}});else if(e.type==='tree')draw.push({y:treeSortY(e),render:()=>{const sp=getTreeSprite(e.seedVal),size=TILE*6.5;ctx.drawImage(sp.canvas,Math.floor(sx-size/2),Math.floor(sy-size/2),size,size);if(e.clicked){ctx.save();ctx.strokeStyle='#0f0';ctx.globalAlpha=.9;ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,Math.max(18,e.radius*TILE+10),0,Math.PI*2);ctx.stroke();ctx.restore()}}});else if(e.type==='bush')draw.push({y:e.y,render:()=>{const sp=e.harvested?getBareBushSprite(e.seedVal):getBushSprite(e.seedVal),size=TILE*2;ctx.globalAlpha=e.harvested?.9:1;ctx.drawImage(sp.canvas,Math.floor(sx+TILE/2-size/2),Math.floor(sy+TILE/2-size/2-4),size,size);ctx.globalAlpha=1;if(e.clicked){ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,e.radius*TILE+5,0,Math.PI*2);ctx.stroke()}}});else if(e.type==='stick')draw.push({y:e.y,render:()=>{if(e.collected)return;const len=e.length*TILE;ctx.save();ctx.translate(sx,sy);ctx.rotate(e.angle);ctx.lineCap='round';
  ctx.strokeStyle='#352416';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-len*.5,1);ctx.lineTo(-len*.18,.5);ctx.lineTo(len*.2,-.5);ctx.lineTo(len*.5,-1);ctx.stroke();
  ctx.strokeStyle='#664326';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-len*.48,0);ctx.lineTo(-len*.15,-.5);ctx.lineTo(len*.18,-1);ctx.lineTo(len*.47,-1.5);ctx.stroke();
  ctx.strokeStyle='rgba(120,82,46,.65)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-len*.25,-1);ctx.lineTo(len*.32,-2);ctx.stroke();
  ctx.strokeStyle='#432b19';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(len*.15,-.5);ctx.lineTo(len*.27,-6);ctx.stroke();
  ctx.restore();if(e.clicked){ctx.strokeStyle='#0f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,Math.max(10,e.radius*TILE+6),0,Math.PI*2);ctx.stroke()}}});else if(e.type==='bigPebble')draw.push({y:e.y,render:()=>{if(e.collected)return;const r=Math.floor(e.radius*TILE);ctx.save();ctx.fillStyle=e.tone>.62?'#8a8880':e.tone>.3?'#aaa69d':'#6f6d67';ctx.beginPath();ctx.ellipse(sx,sy,r*1.18,r*.92,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(225,222,214,.6)';ctx.beginPath();ctx.ellipse(sx-r*.28,sy-r*.3,r*.38,r*.22,-.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(55,52,48,.65)';ctx.lineWidth=1;ctx.stroke();if(e.clicked){ctx.strokeStyle='#ff0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,r+7,0,Math.PI*2);ctx.stroke()};ctx.restore()}});else if(e.type==='flint')draw.push({y:e.y,render:()=>{if(e.collected)return;const ang=e.seedVal%360*Math.PI/180;ctx.save();ctx.translate(sx,sy);ctx.rotate(ang);ctx.fillStyle='#cfd3d0';ctx.beginPath();ctx.moveTo(-7,2);ctx.lineTo(-3,-5);ctx.lineTo(3,-7);ctx.lineTo(8,-2);ctx.lineTo(5,4);ctx.lineTo(-2,6);ctx.closePath();ctx.fill();ctx.fillStyle='#eef1ef';ctx.beginPath();ctx.moveTo(-3,-5);ctx.lineTo(3,-7);ctx.lineTo(1,-1);ctx.lineTo(-2,2);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(80,90,90,.55)';ctx.fillRect(-2,1,5,2);ctx.restore();if(e.clicked){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,11,0,Math.PI*2);ctx.stroke()}}});else if(e.type==='charcoal')draw.push({y:e.y,render:()=>{if(e.collected)return;const r=Math.floor(e.radius*TILE);ctx.fillStyle='#4a4a48';ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2a2a28';ctx.beginPath();ctx.arc(sx-r*.35,sy-r*.35,Math.max(1,r*.35),0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(100,100,100,.4)';ctx.beginPath();ctx.arc(sx+r*.25,sy+r*.2,Math.max(1,r*.25),0,Math.PI*2);ctx.fill();if(e.clicked){ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,r+6,0,Math.PI*2);ctx.stroke()}}});else if(e.type==='pebble')draw.push({y:e.y,render:()=>{const r=Math.floor(e.radius*TILE);ctx.fillStyle=e.tone>.65?'rgba(100,95,85,.8)':e.tone>.35?'rgba(140,135,125,.8)':'rgba(180,175,165,.7)';ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fill();if(e.light>.5){ctx.fillStyle='rgba(220,215,205,.5)';ctx.beginPath();ctx.arc(sx-r*.3,sy-r*.3,Math.max(1,r*.35),0,Math.PI*2);ctx.fill()}if(e.clicked){ctx.strokeStyle='#ff0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,r+3,0,Math.PI*2);ctx.stroke()}}})}
const px=Math.floor((player.x-cx+cols/2)*TILE),py=Math.floor((player.y-cy+rows/2)*TILE);draw.push({y:player.y,render:()=>{const sp=currentPlayerSprite(),size=TILE*1.7;if(sp.complete&&sp.naturalWidth)ctx.drawImage(sp,Math.floor(px+TILE/2-size/2),Math.floor(py+TILE/2-size/2),size,size);else{ctx.fillStyle='#0f0';ctx.fillRect(px+6,py+6,TILE-12,TILE-12)}}});
for(const campfire of player.campfires){const csx=Math.floor((campfire.x-cx+cols/2)*TILE),csy=Math.floor((campfire.y-cy+rows/2)*TILE);draw.push({y:campfire.y,render:()=>{ctx.fillStyle='rgba(232,160,64,.4)';ctx.beginPath();ctx.arc(csx,csy,TILE*1.2,0,Math.PI*2);ctx.fill();const flame=Math.sin(time*3+campfire.fuel)*.5+.5;ctx.fillStyle=`rgba(255,140,0,${.6+flame*.2})`;ctx.beginPath();ctx.arc(csx,csy-4,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,200,0,.8)';ctx.beginPath();ctx.arc(csx,csy-2,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ccc';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(`⚡${Math.ceil(campfire.fuel)}`,csx,csy+TILE)}})}
if(player.placingRecipeId){const recipe=RECIPES.find(r=>r.id===player.placingRecipeId);const mx=Math.floor((player.x-cx+cols/2)*TILE),my=Math.floor((player.y-cy+rows/2)*TILE);ctx.strokeStyle='#e8a040';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(mx,my,TILE*1.3,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(232,160,64,.2)';ctx.beginPath();ctx.arc(mx,my,TILE*1.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8a040';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`Click to place ${recipe?recipe.name:''}`,mx,my)}
for(const e of entities){
  if((e.type==='bigPebble'||e.type==='flint'||e.type==='stick'||e.type==='charcoal')&&!e.collected){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
    if(d<COLLECTION_RANGE){
      const sx=Math.floor((e.x-cx+cols/2)*TILE),sy=Math.floor((e.y-cy+rows/2)*TILE);
      ctx.strokeStyle='#0f0';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(sx,sy,14,0,Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sx-8,sy);ctx.lineTo(sx-5,sy);
      ctx.moveTo(sx+8,sy);ctx.lineTo(sx+5,sy);
      ctx.moveTo(sx,sy-8);ctx.lineTo(sx,sy-5);
      ctx.moveTo(sx,sy+8);ctx.lineTo(sx,sy+5);
      ctx.stroke();
    }
  }
}
draw.sort((a,b)=>a.y-b.y);for(const o of draw)o.render();for(const ft of floatingTexts){const progress=ft.age/ft.life,alpha=Math.max(0,1-progress),rise=progress*TILE*.8;ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=ft.color;ctx.font='bold 14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';const sx=Math.floor((ft.x-cx+cols/2)*TILE),sy=Math.floor((ft.y-cy+rows/2)*TILE+rise);ctx.fillText(ft.text,sx,sy);ctx.restore()}if(vignetteCanvas)ctx.drawImage(vignetteCanvas,0,0);ctx.translate(-shakeX,-shakeY)}

let hudTimer=0;let hudVisible=true;const hudToggle=document.getElementById('hudToggle');function toggleHud(){hudVisible=!hudVisible;if(hudVisible){hud.classList.remove('hidden')}else{hud.classList.add('hidden')}}hudToggle.addEventListener('click',toggleHud);addEventListener('keydown',e=>{if(e.key==='i'||e.key==='I')toggleHud()});function updateHUD(ms=0){hudTimer+=ms;if(hudTimer<100)return;hudTimer=0;let z=0,b=0;for(const e of entities){if(e.type==='zombie')z++;if(e.type==='bush'&&!e.harvested)b++}const t=player.target?player.target.type:'—';const pos=`${Math.round(player.x)}, ${Math.round(player.y)}`;const soilDef=SOIL_DEFS[getTile(Math.floor(player.x),Math.floor(player.y)).type];const soilName=soilDef?soilDef.name:'—';const fiberIcon=`<svg width="20" height="20" viewBox="0 0 64 64" style="display:inline-block;margin-right:6px;vertical-align:middle"><circle cx="32" cy="32" r="10" fill="#5bc46a"/></svg>`;const stickIcon=`<svg width="20" height="20" viewBox="0 0 64 64" style="display:inline-block;margin-right:6px;vertical-align:middle"><g transform="rotate(-30 32 32)"><rect x="28" y="16" width="8" height="32" rx="4" fill="#664326"/></g></svg>`;const pebbleIcon=`<svg width="20" height="20" viewBox="0 0 64 64" style="display:inline-block;margin-right:6px;vertical-align:middle"><ellipse cx="32" cy="32" rx="10" ry="8" fill="#aaa69d"/></svg>`;const flintIcon=`<svg width="20" height="20" viewBox="0 0 64 64" style="display:inline-block;margin-right:6px;vertical-align:middle"><polygon points="16,48 24,16 36,12 48,28 40,56 20,52" fill="#cfd3d0"/></svg>`;hud.innerHTML=`<div style="background:rgba(0,0,0,.75);padding:14px;border:2px solid #0f0;border-radius:4px;font-size:16px;line-height:2.2;font-family:monospace;font-weight:bold">
<div style="color:#0f0;margin-bottom:10px;font-weight:bold;font-size:18px">◆ INVENTORY ◆</div>
<div>${fiberIcon}<span style="color:#8f8">Fiber: ${player.inventory.fiber||0}</span></div>
<div>${stickIcon}<span style="color:#a85">Sticks: ${player.inventory.thickStick||0}</span></div>
<div>${pebbleIcon}<span style="color:#aaa">Pebbles: ${player.inventory.bigPebble||0}</span></div>
<div>${flintIcon}<span style="color:#fff">Flint: ${player.inventory.flint||0}</span></div>
<div><svg width="20" height="20" viewBox="0 0 20 20" style="display:inline-block;margin-right:6px;vertical-align:middle"><circle cx="10" cy="10" r="6" fill="#5a5a58"/><circle cx="8" cy="8" r="2" fill="#3a3a38"/></svg><span style="color:#d8d8d8">Charcoal: ${player.inventory.charcoal||0}</span></div>
${(()=>{const comps=RECIPES.filter(r=>r.stage==='Process'&&(player.inventory[r.id]||0)>0);if(!comps.length)return'';return `<div style="margin-top:8px;border-top:1px solid rgba(0,255,0,.3);padding-top:8px;font-size:12px">`+comps.map(r=>`<div style="color:#cde">${r.name}: ${player.inventory[r.id]}</div>`).join('')+`</div>`})()}
${(()=>{const tools=RECIPES.filter(r=>r.stage==='Haft'&&(player.inventory[r.id]||0)>0);if(!tools.length)return'';return `<div style="margin-top:8px;border-top:1px solid rgba(0,255,0,.3);padding-top:8px">`+tools.map(r=>`<div style="color:#ffd76a">◆ ${r.name}: ${player.inventory[r.id]}</div>`).join('')+`</div>`})()}
<div style="margin-top:10px;border-top:1px solid #0f0;padding-top:10px;color:#0f0;font-size:12px;font-weight:normal">
POS: ${pos} | HP: ${player.hp}<br>
SOIL: ${soilName}<br>
TARGET: ${t} | ENTITIES: ${entities.length}
</div>
</div>`}
for(let i=0;i<5;i++)createEntity('zombie',Math.random()*20-10,Math.random()*20-10);
let last=performance.now();function loop(){const now=performance.now(),raw=Math.min(now-last,100),dt=raw/16.67;last=now;update(dt);render();updateHUD(raw);requestAnimationFrame(loop)}loop();
</script>
