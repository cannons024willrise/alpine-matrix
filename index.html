<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BASE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:monospace;color:#0f0}
  canvas{display:block;image-rendering:pixelated}
  #hud{position:fixed;top:10px;left:10px;font-size:12px;line-height:1.5;z-index:10}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;

// Soft ambient vignette, rebuilt whenever the viewport changes. Cached as an
// offscreen canvas so it costs one drawImage per frame instead of building a
// gradient every frame.
let vignetteCanvas = null;
function buildVignette() {
  const vc = document.createElement('canvas');
  vc.width = W; vc.height = H;
  const vctx = vc.getContext('2d');
  const grad = vctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.72);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  vctx.fillStyle = grad;
  vctx.fillRect(0, 0, W, H);
  vignetteCanvas = vc;
}
buildVignette();

window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  buildVignette();
});

const TILE = 32;

// Fake sun direction used everywhere lighting matters (terrain shade bias,
// tree shading, shadow offsets), so the whole scene reads as lit from one
// consistent place instead of every object shading itself independently.
const LIGHT_DX = -0.55;
const LIGHT_DY = -0.8;

// WORLD GENERATION
function hash(x, y, seed) {
  let h = (x*374761393 + y*668265263 + seed*2147483647) | 0;
  h = (h ^ (h>>>13))*1274126177 | 0;
  return ((h>>>0) % 1000000) / 1000000;
}

function noise(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const sx = x - x0, sy = y - y0;
  const u = sx*sx*(3-2*sx), v = sy*sy*(3-2*sy);
  const n00 = hash(x0, y0, seed);
  const n10 = hash(x0+1, y0, seed);
  const n01 = hash(x0, y0+1, seed);
  const n11 = hash(x0+1, y0+1, seed);
  const nx0 = n00 + u*(n10-n00);
  const nx1 = n01 + u*(n11-n01);
  return nx0 + v*(nx1-nx0);
}

function mixColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  const r = Math.round(r1 + (r2-r1)*t);
  const g = Math.round(g1 + (g2-g1)*t);
  const b = Math.round(b1 + (b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

const SEED = Math.random() * 1e9;
const tileCache = new Map();

function getTile(x, y) {
  const key = `${x},${y}`;
  let tile = tileCache.get(key);

  if (!tile) {
    const n = noise(x*0.05, y*0.05, SEED);
    const shade = noise(x*0.17, y*0.17, SEED + 300); // secondary layer for color variation
    tile = { type: n > 0.5 ? 'grass' : 'dirt', shade };

    // Prevent memory leaks if the player explores endlessly
    if (tileCache.size > 10000) tileCache.clear();
    tileCache.set(key, tile);
  }
  return tile;
}

// Precomputed terrain palettes (dark->light) so each tile is a cheap array
// lookup at render time instead of blending colors every frame.
const GRASS_DARK = '#1f4620', GRASS_LIGHT = '#3c7a3f';
const DIRT_DARK = '#2a1c10', DIRT_LIGHT = '#4a3319';
const PALETTE_STEPS = 8;
const GRASS_PALETTE = [];
const DIRT_PALETTE = [];
for (let i = 0; i <= PALETTE_STEPS; i++) {
  GRASS_PALETTE.push(mixColor(GRASS_DARK, GRASS_LIGHT, i / PALETTE_STEPS));
  DIRT_PALETTE.push(mixColor(DIRT_DARK, DIRT_LIGHT, i / PALETTE_STEPS));
}

// PINE TREE DRAWING
// More realistic conical evergreen with dense foliage and proper lighting
const TIER_COLORS = [
  { dark: '#0a2810', light: '#1e5a2a' }, // bottom, largest tier, very dark
  { dark: '#0f3215', light: '#2a6a35' },
  { dark: '#1a4020', light: '#357a45' },
  { dark: '#2a5030', light: '#4a8a55' }  // top, smallest tier, brightest
];

function drawPineTree(ctx, screenX, screenY, seedVal) {
  const scale = 0.9 + hash(seedVal, 1, 10) * 0.5;
  const trunkW = Math.max(2, Math.floor(2.5 * scale));
  const trunkH = Math.floor(24 * scale);

  // Ground shadow, cast away from the light source
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(screenX - LIGHT_DX * 8, screenY + 2, 18 * scale, 8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();

  // Trunk with realistic two-tone shading
  const trunkX = Math.floor(screenX - trunkW / 2);
  const trunkTop = Math.floor(screenY - trunkH);
  
  const trunkLit = Math.max(1, Math.floor(trunkW * 0.55));
  ctx.fillStyle = '#5a4a2a';
  ctx.fillRect(trunkX, trunkTop, trunkLit, trunkH);
  ctx.fillStyle = '#1a0e08';
  ctx.fillRect(trunkX + trunkLit, trunkTop, trunkW - trunkLit, trunkH);

  // Foliage: 8 tiers for tall, thin cone shape
  const tiers = 8;
  let currentY = screenY - trunkH + 8;
  const steps = 6;

  for (let t = 0; t < tiers; t++) {
    // Narrower base, tapering to point - creates slender cone
    const tierWidth = Math.floor((32 - t * 4.5) * scale);
    const tierHeight = Math.floor((11 - t * 0.5) * scale);
    const stepH = Math.max(1, Math.floor(tierHeight / steps));
    const { dark, light } = TIER_COLORS[Math.min(t, 3)];

    for (let s = 0; s < steps; s++) {
      // Smooth taper within each tier
      const stepW = Math.floor(tierWidth * (1 - (s / steps) * 0.75));
      const jitter = Math.floor((hash(seedVal, t * 10 + s, t) - 0.5) * 3);
      const rx = Math.floor(screenX - stepW / 2) + jitter;
      const ry = Math.floor(currentY - (s + 1) * stepH);

      // Lit and shadow sides with better contrast
      const lightW = Math.max(1, Math.floor(stepW * 0.55));
      ctx.fillStyle = light;
      ctx.fillRect(rx, ry, lightW, stepH);
      ctx.fillStyle = dark;
      ctx.fillRect(rx + lightW, ry, Math.max(1, stepW - lightW), stepH);
      
      // Add subtle edge detail on the dark side
      if (stepW > 6) {
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(rx + stepW - 1, ry, 1, stepH);
      }
    }
    // Greater overlap between tiers for denser look
    currentY -= Math.floor(tierHeight * 0.5);
  }
}

// ZOMBIE SPRITE GENERATION
// Gradient-shaded silhouette (light top-left, dark edges) instead of a flat
// fill, plus glowing eyes and a torn patch, for a more volumetric, undead look.
// Shambling gait (asymmetric legs, wider arm swing, body tilt) is what reads
// as "zombie", not color detail.
function buildZombieSVG(phase, moving) {
  const shuffle = moving ? Math.sin(phase * Math.PI * 2) : 0;
  const legSwing = shuffle * 18;
  const armSwing = shuffle * 35;
  const tilt = shuffle * 8;
  const armDrop = moving ? 8 : 4;
  const limbColor = '#3f8a4c';

  return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-64 -64 128 128">
    <defs>
      <radialGradient id="zBody" cx="35%" cy="25%" r="80%">
        <stop offset="0%" stop-color="#77cf85"/>
        <stop offset="100%" stop-color="#2e5c37"/>
      </radialGradient>
      <radialGradient id="zHead" cx="35%" cy="25%" r="80%">
        <stop offset="0%" stop-color="#6ec97e"/>
        <stop offset="100%" stop-color="#2e5c37"/>
      </radialGradient>
    </defs>

    <ellipse cx="0" cy="32" rx="18" ry="6" fill="rgba(0,0,0,0.25)"/>

    <g transform="rotate(${legSwing * 0.7} -6 6)">
      <rect x="-10" y="6" width="8" height="28" rx="4" fill="${limbColor}"/>
    </g>
    <g transform="rotate(${-legSwing * 1.2} 6 6)">
      <rect x="2" y="4" width="8" height="30" rx="4" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${armSwing * 1.1} -16 ${-armDrop}) skewX(${shuffle * 6})">
      <rect x="-20" y="${-12 - armDrop}" width="7" height="28" rx="3.5" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${tilt})">
      <rect x="-13" y="-18" width="26" height="36" rx="10" fill="url(#zBody)"/>
      <rect x="-9" y="-6" width="5" height="10" rx="1" fill="#1c3a22" opacity="0.6"/>
    </g>

    <g transform="rotate(${-armSwing * 0.9} 16 ${-armDrop + 2}) skewX(${-shuffle * 4})">
      <rect x="13" y="${-10 - armDrop}" width="7" height="26" rx="3.5" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${tilt * 0.6})">
      <circle cx="0" cy="-28" r="13" fill="url(#zHead)"/>
      <circle cx="-4" cy="-29" r="1.6" fill="#ff5a4d"/>
      <circle cx="4" cy="-29" r="1.6" fill="#ff5a4d"/>
    </g>
  </svg>`;
}

const ZOMBIE_FRAME_COUNT = 8;
const zombieFrames = [];
for (let i = 0; i < ZOMBIE_FRAME_COUNT; i++) {
  const svg = buildZombieSVG(i / ZOMBIE_FRAME_COUNT, true);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  zombieFrames.push(img);
}
const zombieIdleFrame = new Image();
zombieIdleFrame.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildZombieSVG(0, false));

function currentZombieSprite(e) {
  if (!e.vx && !e.vy) return zombieIdleFrame;
  const idx = Math.floor(e.animPhase * ZOMBIE_FRAME_COUNT) % ZOMBIE_FRAME_COUNT;
  return zombieFrames[idx];
}

// ENTITIES
const entities = [];
let nextId = 0;

function createEntity(type, x, y) {
  const entity = {
    id: nextId++,
    type,
    x, y,
    vx: 0, vy: 0,
    hp: type === 'zombie' ? 30 : 100,
    animPhase: 0
  };
  if (type === 'zombie') {
    entity.colorSeed = Math.random();
  }
  entities.push(entity);
}

// PLAYER
const player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  hp: 100,
  speed: 0.15,
  facingAngle: Math.PI / 2, // radians, 0 = facing right
  animPhase: 0,
  moving: false
};

// ANIMATED SVG PLAYER SPRITE
// Enhanced walk cycle with dynamic leg extensions, arm swing, torso tilt, and
// head counter-sway. Gradient-shaded body/head for a rounded, lit look
// instead of a flat silhouette.
function buildPlayerSVG(phase, moving) {
  const cycle = phase * Math.PI * 2;
  const swing = moving ? Math.sin(cycle) : 0;

  const legAngle = swing * 28;
  const armAngle = -swing * 32;
  const bob = moving ? Math.abs(Math.sin(cycle * 2)) * 3.5 : 0;
  const bodyTilt = moving ? swing * 4 : 0;
  const headSway = moving ? -swing * 3 : 0;
  const limbColor = '#bcd9c4';

  return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-64 -64 128 128">
    <defs>
      <radialGradient id="pBody" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#cfe6d6"/>
      </radialGradient>
      <radialGradient id="pHead" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#d6ebdc"/>
      </radialGradient>
    </defs>

    <ellipse cx="${swing * 2}" cy="32" rx="${20 - Math.abs(swing) * 2}" ry="7" fill="rgba(0,0,0,0.35)"/>

    <g transform="rotate(${legAngle} -6 6) translate(0 ${-bob})">
      <rect x="-11" y="4" width="9" height="27" rx="4.5" fill="${limbColor}"/>
    </g>
    <g transform="rotate(${-legAngle} 6 6) translate(0 ${-bob})">
      <rect x="2" y="4" width="9" height="27" rx="4.5" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${-armAngle} -15 -4) translate(0 ${-bob})">
      <rect x="-19" y="-10" width="8" height="25" rx="4" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${bodyTilt} 0 0) translate(0 ${-bob})">
      <rect x="-14" y="-19" width="28" height="34" rx="11" fill="url(#pBody)"/>
    </g>

    <g transform="rotate(${armAngle} 15 -4) translate(0 ${-bob})">
      <rect x="11" y="-10" width="8" height="25" rx="4" fill="${limbColor}"/>
    </g>

    <g transform="rotate(${headSway} 0 ${-29 - bob}) translate(0 ${-bob})">
      <circle cx="0" cy="-29" r="12.5" fill="url(#pHead)"/>
      <circle cx="-4" cy="-30" r="1.4" fill="#1a2b20"/>
      <circle cx="4" cy="-30" r="1.4" fill="#1a2b20"/>
    </g>
  </svg>`;
}

const PLAYER_FRAME_COUNT = 8;
const playerFrames = [];
for (let i = 0; i < PLAYER_FRAME_COUNT; i++) {
  const svg = buildPlayerSVG(i / PLAYER_FRAME_COUNT, true);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  playerFrames.push(img);
}
const playerIdleFrame = new Image();
playerIdleFrame.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildPlayerSVG(0, false));

function currentPlayerSprite() {
  if (!player.moving) return playerIdleFrame;
  const idx = Math.floor(player.animPhase * PLAYER_FRAME_COUNT) % PLAYER_FRAME_COUNT;
  return playerFrames[idx];
}

// INPUT
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// UPDATE
function update(dt) {
  // player movement
  player.vx = 0;
  player.vy = 0;
  if (keys['w'] || keys['W'] || keys['ArrowUp']) player.vy -= player.speed;
  if (keys['s'] || keys['S'] || keys['ArrowDown']) player.vy += player.speed;
  if (keys['a'] || keys['A'] || keys['ArrowLeft']) player.vx -= player.speed;
  if (keys['d'] || keys['D'] || keys['ArrowRight']) player.vx += player.speed;

  player.moving = player.vx !== 0 || player.vy !== 0;
  if (player.moving) {
    player.facingAngle = Math.atan2(player.vy, player.vx);
    player.animPhase = (player.animPhase + dt * 0.045) % 1;
  }

  player.x += player.vx;
  player.y += player.vy;

  // entity AI
  for (const e of entities) {
    if (e.type === 'zombie') {
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      const detectionRange = 10;

      if (dist < detectionRange) {
        // player detected, chase
        if (dist > 0.1) {
          e.vx = (dx / dist) * 0.08;
          e.vy = (dy / dist) * 0.08;
        }
        e.aware = true;
      } else {
        // out of range, stop
        e.vx = 0;
        e.vy = 0;
        e.aware = false;
      }

      e.x += e.vx;
      e.y += e.vy;

      // animate zombie
      if (e.vx !== 0 || e.vy !== 0) {
        e.animPhase = (e.animPhase + dt * 0.04) % 1;
      } else {
        e.animPhase = 0;
      }
    }
  }
}

// RENDER
function render() {
  // Reset canvas state at the top of every frame. Without this, any drawing
  // call that changes globalAlpha/compositing and doesn't get to clean up
  // after itself (e.g. an interrupted draw) would silently bleed into every
  // frame after it, washing out the colors of everything drawn afterward.
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const cx = player.x;
  const cy = player.y;
  const cols = Math.ceil(W / TILE) + 4;
  const rows = Math.ceil(H / TILE) + 4;
  const startX = Math.floor(cx - cols/2);
  const startY = Math.floor(cy - rows/2);
  const time = Date.now() * 0.003;

  // terrain pass
  for (let ty = startY; ty < startY + rows; ty++) {
    for (let tx = startX; tx < startX + cols; tx++) {
      const tile = getTile(tx, ty);
      // Math.floor prevents expensive sub-pixel rendering
      const sx = Math.floor((tx - cx + cols/2) * TILE);
      const sy = Math.floor((ty - cy + rows/2) * TILE);
      const shadeIdx = Math.min(PALETTE_STEPS, Math.floor(tile.shade * PALETTE_STEPS));

      if (tile.type === 'grass') {
        // Mottled ground color
        ctx.fillStyle = GRASS_PALETTE[shadeIdx];
        ctx.fillRect(sx, sy, TILE, TILE);

        // Visible grass animation with bent tips
        const baseSway = Math.sin(time + tx * 0.3 + ty * 0.3) * 3;
        const grassCount = Math.floor(hash(tx, ty, 1) * 6) + 6;
        for (let i = 0; i < grassCount; i++) {
          const grassX = Math.floor(sx + hash(tx, ty, i * 2 + 101) * (TILE - 2));
          const grassY = Math.floor(sy + hash(tx, ty, i * 2 + 102) * (TILE - 8) + 4);
          const offsetSway = (i % 3) - 1;
          const tipBend = Math.floor(baseSway + offsetSway * 1);
          
          ctx.fillStyle = hash(tx, ty, i * 2 + 103) > 0.5 ? '#5bc46a' : '#3a7a42';
          
          // Blade base (straight, rooted at bottom)
          ctx.fillRect(grassX, grassY + 2, 2, 3);
          
          // Blade tip (bent with sway, points upward)
          ctx.fillRect(grassX + tipBend, grassY - 2, 2, 2);
        }

        // Occasional flower detail
        if (hash(tx, ty, 777) > 0.94) {
          const fx = Math.floor(sx + hash(tx, ty, 778) * (TILE - 4) + 2);
          const fy = Math.floor(sy + hash(tx, ty, 779) * (TILE - 4) + 2);
          ctx.fillStyle = hash(tx, ty, 780) > 0.5 ? '#f2e26b' : '#f0f0f0';
          ctx.fillRect(fx, fy, 2, 2);
        }
      } else {
        // Earthy dirt tones instead of a near-black green
        ctx.fillStyle = DIRT_PALETTE[shadeIdx];
        ctx.fillRect(sx, sy, TILE, TILE);

        // Small pebbles for texture
        if (hash(tx, ty, 790) > 0.7) {
          const rx2 = Math.floor(sx + hash(tx, ty, 791) * (TILE - 6) + 3);
          const ry2 = Math.floor(sy + hash(tx, ty, 792) * (TILE - 6) + 3);
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.fillRect(rx2, ry2, 3, 2);
        }
      }
    }
  }

  // Y-Sorted Objects Pass (Pine Trees, Zombies, Player)
  const drawObjects = [];

  // Irregularly placed pine trees using noise and non-grid offsets
  for (let ty = startY - 2; ty < startY + rows + 2; ty++) {
    for (let tx = startX - 2; tx < startX + cols + 2; tx++) {
      const treeDensity = noise(tx * 0.12, ty * 0.12, SEED + 500);
      if (treeDensity > 0.62) {
        const offsetX = (hash(tx, ty, 801) - 0.5) * TILE * 1.2;
        const offsetY = (hash(tx, ty, 802) - 0.5) * TILE * 1.2;
        const worldX = tx + 0.5 + offsetX / TILE;
        const worldY = ty + 0.5 + offsetY / TILE;

        const sx = Math.floor((worldX - cx + cols/2) * TILE);
        const sy = Math.floor((worldY - cy + rows/2) * TILE);
        const seedVal = Math.floor(hash(tx, ty, 999) * 100000);

        drawObjects.push({
          type: 'tree',
          y: worldY,
          render: () => drawPineTree(ctx, sx, sy, seedVal)
        });
      }
    }
  }

  // Entities
  for (const e of entities) {
    const sx = Math.floor((e.x - cx + cols/2) * TILE);
    const sy = Math.floor((e.y - cy + rows/2) * TILE);

    if (e.type === 'zombie') {
      drawObjects.push({
        type: 'zombie',
        y: e.y,
        render: () => {
          if (e.aware) {
            // save/restore guarantees globalAlpha always gets put back,
            // even if a future edit throws partway through this block
            ctx.save();
            ctx.strokeStyle = '#f00';
            ctx.globalAlpha = 0.22 + Math.sin(Date.now() * 0.004) * 0.06;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx + TILE/2, sy + TILE/2, 10 * TILE, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          const zombieSprite = currentZombieSprite(e);
          const spriteSize = TILE * 1.7;
          if (zombieSprite.complete && zombieSprite.naturalWidth > 0) {
            const dx = Math.floor(sx + TILE/2 - spriteSize/2);
            const dy = Math.floor(sy + TILE/2 - spriteSize/2);
            ctx.drawImage(zombieSprite, dx, dy, spriteSize, spriteSize);
          } else {
            ctx.fillStyle = e.aware ? '#f00' : '#600';
            ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
          }
        }
      });
    }
  }

  // Player
  const px = Math.floor((player.x - cx + cols/2) * TILE);
  const py = Math.floor((player.y - cy + rows/2) * TILE);
  drawObjects.push({
    type: 'player',
    y: player.y,
    render: () => {
      const sprite = currentPlayerSprite();
      const spriteSize = TILE * 1.7;
      if (sprite.complete && sprite.naturalWidth > 0) {
        const dx = Math.floor(px + TILE/2 - spriteSize/2);
        const dy = Math.floor(py + TILE/2 - spriteSize/2);
        ctx.drawImage(sprite, dx, dy, spriteSize, spriteSize);
      } else {
        ctx.fillStyle = '#0f0';
        ctx.fillRect(px + 6, py + 6, TILE - 12, TILE - 12);
      }
    }
  });

  // Sort by Y position so characters pass naturally behind/in front of trees
  drawObjects.sort((a, b) => a.y - b.y);
  for (const obj of drawObjects) {
    obj.render();
  }

  // Ambient vignette on top of everything, for depth and focus
  if (vignetteCanvas) ctx.drawImage(vignetteCanvas, 0, 0);
}

// HUD
function updateHUD() {
  hud.innerHTML = `
    Player: (${Math.round(player.x)}, ${Math.round(player.y)}) HP: ${player.hp}<br>
    Entities: ${entities.length}<br>
    Zombies: ${entities.filter(e => e.type === 'zombie').length}
  `;
}

// SPAWN TEST ZOMBIES
for (let i = 0; i < 5; i++) {
  createEntity('zombie', Math.random() * 20 - 10, Math.random() * 20 - 10);
}

// LOOP
let lastTime = Date.now();
function loop() {
  const now = Date.now();
  const dt = (now - lastTime) / 16.67; // rough ms->frame conversion
  lastTime = now;

  update(dt);
  render();
  updateHUD();

  requestAnimationFrame(loop);
}

loop();
</script>
