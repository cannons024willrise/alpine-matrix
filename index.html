<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BASE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:monospace;color:#0f0}
  canvas{display:block;image-rendering:pixelated}
  #hud{position:fixed;top:10px;left:10px;font-size:12px;line-height:1.5;z-index:10}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
ctx.imageSmoothingEnabled = true;

let W = window.innerWidth;
let H = window.innerHeight;
canvas.width = W;
canvas.height = H;
window.addEventListener('resize', () => {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
});

const TILE = 32;

// WORLD GENERATION
function hash(x, y, seed) {
  let h = (x*374761393 + y*668265263 + seed*2147483647) | 0;
  h = (h ^ (h>>>13))*1274126177 | 0;
  return ((h>>>0) % 1000000) / 1000000;
}

function noise(x, y, seed) {
  const x0 = Math.floor(x);
  const y0 = Math.floor(y);
  const sx = x - x0, sy = y - y0;
  const u = sx*sx*(3-2*sx), v = sy*sy*(3-2*sy);
  const n00 = hash(x0, y0, seed);
  const n10 = hash(x0+1, y0, seed);
  const n01 = hash(x0, y0+1, seed);
  const n11 = hash(x0+1, y0+1, seed);
  const nx0 = n00 + u*(n10-n00);
  const nx1 = n01 + u*(n11-n01);
  return nx0 + v*(nx1-nx0);
}

const SEED = Math.random() * 1e9;
let worldTime = 0;
function getTile(x, y) {
  const n = noise(x*0.05, y*0.05, SEED);
  return { type: n > 0.5 ? 'grass' : 'dirt' };
}

// ZOMBIE SPRITE GENERATION
// Minimalist monotone silhouette, matching the player's style — flat green,
// no gradients/shading. Shambling gait (asymmetric legs, wider arm swing,
// body tilt) is what reads as "zombie", not color detail.
function buildZombieSVG(phase, moving) {
  const shuffle = moving ? Math.sin(phase * Math.PI * 2) : 0;
  const legSwing = shuffle * 18;
  const armSwing = shuffle * 35;
  const tilt = shuffle * 8;
  const armDrop = moving ? 8 : 4;
  const C = '#4fae5e';

  return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-64 -64 128 128">
    <ellipse cx="0" cy="32" rx="18" ry="6" fill="rgba(0,0,0,0.25)"/>

    <g transform="rotate(${legSwing * 0.7} -6 6)">
      <rect x="-10" y="6" width="8" height="28" rx="4" fill="${C}"/>
    </g>
    <g transform="rotate(${-legSwing * 1.2} 6 6)">
      <rect x="2" y="4" width="8" height="30" rx="4" fill="${C}"/>
    </g>

    <g transform="rotate(${armSwing * 1.1} -16 ${-armDrop}) skewX(${shuffle * 6})">
      <rect x="-20" y="${-12 - armDrop}" width="7" height="28" rx="3.5" fill="${C}"/>
    </g>

    <g transform="rotate(${tilt})">
      <rect x="-13" y="-18" width="26" height="36" rx="10" fill="${C}"/>
    </g>

    <g transform="rotate(${-armSwing * 0.9} 16 ${-armDrop + 2}) skewX(${-shuffle * 4})">
      <rect x="13" y="${-10 - armDrop}" width="7" height="26" rx="3.5" fill="${C}"/>
    </g>

    <g transform="rotate(${tilt * 0.6})">
      <circle cx="0" cy="-28" r="13" fill="${C}"/>
    </g>
  </svg>`;
}

const ZOMBIE_FRAME_COUNT = 8;
const zombieFrames = [];
for (let i = 0; i < ZOMBIE_FRAME_COUNT; i++) {
  const svg = buildZombieSVG(i / ZOMBIE_FRAME_COUNT, true);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  zombieFrames.push(img);
}
const zombieIdleFrame = new Image();
zombieIdleFrame.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildZombieSVG(0, false));

function currentZombieSprite(e) {
  if (!e.vx && !e.vy) return zombieIdleFrame;
  const idx = Math.floor(e.animPhase * ZOMBIE_FRAME_COUNT) % ZOMBIE_FRAME_COUNT;
  return zombieFrames[idx];
}

// ENTITIES
const entities = [];
let nextId = 0;

function createEntity(type, x, y) {
  const entity = {
    id: nextId++,
    type,
    x, y,
    vx: 0, vy: 0,
    hp: type === 'zombie' ? 30 : 100,
    animPhase: 0
  };
  if (type === 'zombie') {
    entity.colorSeed = Math.random();
  }
  entities.push(entity);
}

// PLAYER
const player = {
  x: 0, y: 0,
  vx: 0, vy: 0,
  hp: 100,
  speed: 0.15,
  facingAngle: Math.PI / 2, // radians, 0 = facing right
  animPhase: 0,
  moving: false
};

// ANIMATED SVG PLAYER SPRITE
// Minimalist monotone top-down humanoid silhouette: shadow, legs, torso, arms, head.
// Limb rotation is driven by `phase` (0..1 walk cycle). Sprite always faces
// forward (no rotation) — only limbs animate.
function buildPlayerSVG(phase, moving) {
  const swing = moving ? Math.sin(phase * Math.PI * 2) : 0;
  const legAngle = swing * 22;
  const armAngle = -swing * 26;
  const bob = moving ? Math.abs(Math.sin(phase * Math.PI * 2)) * 2 : 0;
  const C = '#e8f5ec';

  return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-64 -64 128 128">
    <ellipse cx="0" cy="32" rx="20" ry="7" fill="rgba(0,0,0,0.35)"/>

    <g transform="rotate(${legAngle} -6 6) translate(0 ${-bob})">
      <rect x="-11" y="4" width="9" height="27" rx="4.5" fill="${C}"/>
    </g>
    <g transform="rotate(${-legAngle} 6 6) translate(0 ${-bob})">
      <rect x="2" y="4" width="9" height="27" rx="4.5" fill="${C}"/>
    </g>

    <g transform="rotate(${-armAngle} -15 -4) translate(0 ${-bob})">
      <rect x="-19" y="-10" width="8" height="25" rx="4" fill="${C}"/>
    </g>

    <rect x="-14" y="${-19 - bob}" width="28" height="34" rx="11" fill="${C}"/>

    <g transform="rotate(${armAngle} 15 -4) translate(0 ${-bob})">
      <rect x="11" y="-10" width="8" height="25" rx="4" fill="${C}"/>
    </g>

    <circle cx="0" cy="${-29 - bob}" r="12.5" fill="${C}"/>
  </svg>`;
}

const PLAYER_FRAME_COUNT = 8;
const playerFrames = [];
for (let i = 0; i < PLAYER_FRAME_COUNT; i++) {
  const svg = buildPlayerSVG(i / PLAYER_FRAME_COUNT, true);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  playerFrames.push(img);
}
const playerIdleFrame = new Image();
playerIdleFrame.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildPlayerSVG(0, false));

function currentPlayerSprite() {
  if (!player.moving) return playerIdleFrame;
  const idx = Math.floor(player.animPhase * PLAYER_FRAME_COUNT) % PLAYER_FRAME_COUNT;
  return playerFrames[idx];
}

// INPUT
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// UPDATE
function update(dt) {
  worldTime += dt * 0.14;
  // player movement
  player.vx = 0;
  player.vy = 0;
  if (keys['w'] || keys['W'] || keys['ArrowUp']) player.vy -= player.speed;
  if (keys['s'] || keys['S'] || keys['ArrowDown']) player.vy += player.speed;
  if (keys['a'] || keys['A'] || keys['ArrowLeft']) player.vx -= player.speed;
  if (keys['d'] || keys['D'] || keys['ArrowRight']) player.vx += player.speed;

  player.moving = player.vx !== 0 || player.vy !== 0;
  if (player.moving) {
    player.facingAngle = Math.atan2(player.vy, player.vx);
    player.animPhase = (player.animPhase + dt * 0.045) % 1;
  }

  player.x += player.vx;
  player.y += player.vy;
  
  // entity AI
  for (const e of entities) {
    if (e.type === 'zombie') {
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const dist = Math.hypot(dx, dy);
      const detectionRange = 10;
      
      if (dist < detectionRange) {
        // player detected, chase
        if (dist > 0.1) {
          e.vx = (dx / dist) * 0.08;
          e.vy = (dy / dist) * 0.08;
        }
        e.aware = true;
      } else {
        // out of range, stop
        e.vx = 0;
        e.vy = 0;
        e.aware = false;
      }
      
      e.x += e.vx;
      e.y += e.vy;
      
      // animate zombie
      if (e.vx !== 0 || e.vy !== 0) {
        e.animPhase = (e.animPhase + dt * 0.04) % 1;
      } else {
        e.animPhase = 0;
      }
    }
  }
}

// RENDER
function render() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  
  const cx = player.x;
  const cy = player.y;
  const cols = Math.ceil(W / TILE) + 2;
  const rows = Math.ceil(H / TILE) + 2;
  const startX = Math.floor(cx - cols/2);
  const startY = Math.floor(cy - rows/2);
  
  // terrain
  for (let ty = startY; ty < startY + rows; ty++) {
    for (let tx = startX; tx < startX + cols; tx++) {
      const tile = getTile(tx, ty);
      const sx = (tx - cx + cols/2) * TILE;
      const sy = (ty - cy + rows/2) * TILE;

      // Slight overlap hides seams so tiles feel like ground, not postage stamps.
      ctx.fillStyle = tile.type === 'grass' ? '#244f24' : '#172f17';
      ctx.fillRect(sx - 0.5, sy - 0.5, TILE + 1, TILE + 1);

      if (tile.type === 'grass') {
        const seed = hash(tx, ty, SEED);
        const bladeCount = 6 + Math.floor(seed * 4);
        const baseY = sy + TILE - 2;
        for (let i = 0; i < bladeCount; i++) {
          const fx = ((i + 1) / (bladeCount + 1)) * TILE;
          const swaySeed = hash(tx * 7 + i, ty * 11 - i, SEED + 13);
          const phase = worldTime * 0.95 + swaySeed * Math.PI * 2;
          const wind = Math.sin(phase) * (0.7 + swaySeed * 0.45);
          const bend = wind * (8 + swaySeed * 5.5);
          const bladeH = 8 + Math.floor(swaySeed * 9);
          const bladeX = sx + fx;
          const tipY = baseY - bladeH;
          const midY = baseY - bladeH * 0.55;
          const tipX = bladeX + bend;
          const midX = bladeX + bend * 0.42;
          ctx.strokeStyle = swaySeed > 0.5 ? 'rgba(150, 230, 128, 0.88)' : 'rgba(92, 170, 80, 0.72)';
          ctx.lineWidth = 1.05;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bladeX, baseY);
          ctx.quadraticCurveTo(midX, midY, tipX, tipY);
          ctx.stroke();

          // tiny secondary curl so the motion reads as grass, not wires
          ctx.globalAlpha = 0.45;
          ctx.beginPath();
          ctx.moveTo(bladeX, baseY);
          ctx.quadraticCurveTo(bladeX + bend * 0.2, baseY - bladeH * 0.32, bladeX + bend * 0.62, baseY - bladeH * 0.78);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // Soft flecks keep the grass from reading as rigid squares.
        ctx.fillStyle = 'rgba(160, 220, 130, 0.10)';
        ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
      } else {
        const seed = hash(tx, ty, SEED + 99);
        if (seed > 0.72) {
          ctx.fillStyle = 'rgba(70, 95, 55, 0.45)';
          ctx.fillRect(sx + 5, sy + 11, 4, 2);
        }
      }
    }
  }
  
  // entities
  for (const e of entities) {
    const sx = (e.x - cx + cols/2) * TILE;
    const sy = (e.y - cy + rows/2) * TILE;
    
    if (e.type === 'zombie') {
      // detection range circle
      if (e.aware) {
        ctx.strokeStyle = '#f00';
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(sx + TILE/2, sy + TILE/2, 10 * TILE, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      
      // animated zombie sprite
      const zombieSprite = currentZombieSprite(e);
      const spriteSize = TILE * 1.7;
      if (zombieSprite.complete && zombieSprite.naturalWidth > 0) {
        ctx.drawImage(zombieSprite, sx + TILE/2 - spriteSize/2, sy + TILE/2 - spriteSize/2, spriteSize, spriteSize);
      } else {
        ctx.fillStyle = e.aware ? '#f00' : '#600';
        ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
      }
    }
  }
  
  // player
  const px = (player.x - cx + cols/2) * TILE;
  const py = (player.y - cy + rows/2) * TILE;
  const sprite = currentPlayerSprite();
  const spriteSize = TILE * 1.7;
  if (sprite.complete && sprite.naturalWidth > 0) {
    ctx.drawImage(sprite, px + TILE/2 - spriteSize/2, py + TILE/2 - spriteSize/2, spriteSize, spriteSize);
  } else {
    ctx.fillStyle = '#0f0';
    ctx.fillRect(px + 6, py + 6, TILE - 12, TILE - 12);
  }
  
  // LIGHTING
  // dark overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.fillRect(0, 0, W, H);
  
  // player light source
  const playerScreenX = W / 2;
  const playerScreenY = H / 2;
  const lightRadius = TILE * 12;
  const lightGrad = ctx.createRadialGradient(playerScreenX, playerScreenY, TILE * 2, playerScreenX, playerScreenY, lightRadius);
  lightGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  lightGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
  
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = lightGrad;
  ctx.fillRect(playerScreenX - lightRadius, playerScreenY - lightRadius, lightRadius * 2, lightRadius * 2);
  ctx.globalCompositeOperation = 'source-over';
}

// HUD
function updateHUD() {
  hud.innerHTML = `
    Player: (${Math.round(player.x)}, ${Math.round(player.y)}) HP: ${player.hp}<br>
    Entities: ${entities.length}<br>
    Zombies: ${entities.filter(e => e.type === 'zombie').length}
  `;
}

// SPAWN TEST ZOMBIES
for (let i = 0; i < 5; i++) {
  createEntity('zombie', Math.random() * 20 - 10, Math.random() * 20 - 10);
}

// LOOP
let lastTime = Date.now();
function loop() {
  const now = Date.now();
  const dt = (now - lastTime) / 16.67; // rough ms->frame conversion
  lastTime = now;
  
  update(dt);
  render();
  updateHUD();
  
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
