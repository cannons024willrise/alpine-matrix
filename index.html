<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Game - Inventory System</title>
<style>
    body {
        background-color: #2b2b2b;
        color: white;
        font-family: monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        user-select: none;
    }
    
    /* Minecraft-styled UI */
    .mc-panel {
        background-color: #c6c6c6;
        border: 4px solid #fff;
        border-bottom-color: #555;
        border-right-color: #555;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(9, 48px);
        gap: 4px;
        box-shadow: inset -2px -2px 0px rgba(0,0,0,0.25);
    }
    
    .mc-slot {
        width: 48px;
        height: 48px;
        background-color: #8b8b8b;
        border: 2px solid #373737;
        border-top-color: #fff;
        border-left-color: #fff;
        position: relative;
        box-sizing: border-box;
        background-size: contain;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        color: white;
        font-size: 16px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #000;
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        padding: 2px;
        cursor: pointer;
    }

    .mc-slot:hover {
        background-color: #9c9c9c;
    }
    
    #floating-cursor-item {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        display: none;
        width: 48px;
        height: 48px;
        transform: translate(-50%, -50%);
        background-size: contain;
        background-repeat: no-repeat;
        image-rendering: pixelated;
        color: white;
        font-family: monospace;
        font-size: 16px;
        font-weight: bold;
        text-shadow: 2px 2px 0 #000;
        text-align: right;
        line-height: 48px;
        padding-right: 4px;
        box-sizing: border-box;
    }
</style>
</head>
<body>

<div class="mc-panel">
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
    <div class="mc-slot"></div>
</div>

<script>
const inventoryDragState = {
    active: false,
    type: null,
    quantity: 0,
    maxStack: 0,
    floatingElement: null
};

function createFloatingElement() {
    const el = document.createElement('div');
    el.id = 'floating-cursor-item';
    document.body.appendChild(el);
    inventoryDragState.floatingElement = el;
}

function updateFloatingElementPosition(x, y) {
    if (inventoryDragState.active && inventoryDragState.floatingElement) {
        inventoryDragState.floatingElement.style.left = x + 'px';
        inventoryDragState.floatingElement.style.top = y + 'px';
    }
}

function updateFloatingElementDisplay() {
    const el = inventoryDragState.floatingElement;
    if (inventoryDragState.quantity > 0) {
        el.style.display = 'block';
        el.textContent = inventoryDragState.quantity > 1 ? inventoryDragState.quantity : '';
        el.style.backgroundImage = `url('assets/${inventoryDragState.type}.png')`;
        
        // Fallback coloring to visualize items without external asset images
        el.style.backgroundColor = inventoryDragState.type === 'wood' ? '#8b5a2b' : (inventoryDragState.type === 'stone' ? '#777777' : 'transparent');
    } else {
        el.style.display = 'none';
        inventoryDragState.active = false;
        inventoryDragState.type = null;
    }
}

function handleInventoryClick(event, slotObj, domSlotElement, maxStackResolver) {
    event.preventDefault();
    const isRightClick = event.button === 2;
    const isLeftClick = event.button === 0;

    if (!isRightClick && !isLeftClick) return;

    if (!inventoryDragState.active) {
        if (!slotObj || slotObj.quantity === 0) return;

        inventoryDragState.type = slotObj.type;
        inventoryDragState.maxStack = maxStackResolver(slotObj.type);
        
        if (isRightClick) {
            const takeAmount = Math.ceil(slotObj.quantity / 2);
            inventoryDragState.quantity = takeAmount;
            slotObj.quantity -= takeAmount;
        } else if (isLeftClick) {
            inventoryDragState.quantity = slotObj.quantity;
            slotObj.quantity = 0;
            slotObj.type = null;
        }
        
        inventoryDragState.active = true;
    } else {
        if (!slotObj || slotObj.quantity === 0) {
            if (isRightClick) {
                slotObj.type = inventoryDragState.type;
                slotObj.quantity = 1;
                inventoryDragState.quantity -= 1;
            } else if (isLeftClick) {
                slotObj.type = inventoryDragState.type;
                slotObj.quantity = inventoryDragState.quantity;
                inventoryDragState.quantity = 0;
            }
        } else if (slotObj.type === inventoryDragState.type) {
            const spaceLeft = maxStackResolver(slotObj.type) - slotObj.quantity;
            
            if (isRightClick && spaceLeft > 0) {
                slotObj.quantity += 1;
                inventoryDragState.quantity -= 1;
            } else if (isLeftClick) {
                const transferAmount = Math.min(spaceLeft, inventoryDragState.quantity);
                slotObj.quantity += transferAmount;
                inventoryDragState.quantity -= transferAmount;
            }
        } else if (isLeftClick) {
            const tempType = slotObj.type;
            const tempQuantity = slotObj.quantity;
            slotObj.type = inventoryDragState.type;
            slotObj.quantity = inventoryDragState.quantity;
            inventoryDragState.type = tempType;
            inventoryDragState.quantity = tempQuantity;
            inventoryDragState.maxStack = maxStackResolver(tempType);
        }
    }

    if (slotObj.quantity === 0) {
        slotObj.type = null;
    }

    updateFloatingElementDisplay();
    updateVisualSlot(domSlotElement, slotObj);
}

function updateVisualSlot(element, slotObj) {
    if (!slotObj || slotObj.quantity === 0) {
        element.style.backgroundImage = 'none';
        element.style.backgroundColor = 'transparent';
        element.textContent = '';
    } else {
        element.style.backgroundImage = `url('assets/${slotObj.type}.png')`;
        element.textContent = slotObj.quantity > 1 ? slotObj.quantity : '';
        
        // Fallback coloring to visualize items without external asset images
        element.style.backgroundColor = slotObj.type === 'wood' ? '#8b5a2b' : (slotObj.type === 'stone' ? '#777777' : 'transparent');
    }
}

function initializeMinecraftInventorySystem(inventoryArray, maxStackDictionary) {
    createFloatingElement();
    const domSlots = document.querySelectorAll('.mc-slot');
    
    document.addEventListener('mousemove', function(e) {
        updateFloatingElementPosition(e.clientX, e.clientY);
    });

    document.addEventListener('contextmenu', function(e) {
        if (e.target.closest('.mc-panel') || e.target.closest('.mc-slot')) {
            e.preventDefault();
        }
    });

    domSlots.forEach(function(slot, index) {
        // Ensure initial sync between UI and array
        const slotData = inventoryArray[index] || { type: null, quantity: 0 };
        inventoryArray[index] = slotData;
        updateVisualSlot(slot, slotData);

        slot.addEventListener('mousedown', function(e) {
            function resolveMaxStack(itemType) {
                return maxStackDictionary[itemType] || 1;
            }
            
            handleInventoryClick(e, inventoryArray[index], slot, resolveMaxStack);
        });
    });
}

// Data initialization execution
const gameInventoryData = [
    { type: 'wood', quantity: 64 },
    { type: 'stone', quantity: 32 },
    { type: null, quantity: 0 },
    { type: 'wood', quantity: 15 },
    { type: null, quantity: 0 },
    { type: null, quantity: 0 },
    { type: null, quantity: 0 },
    { type: null, quantity: 0 },
    { type: null, quantity: 0 }
];

const itemMaxStacks = {
    'wood': 64,
    'stone': 64,
    'stalk_fiber': 8,
    'cordage': 4
};

window.onload = function() {
    initializeMinecraftInventorySystem(gameInventoryData, itemMaxStacks);
};
</script>
</body>
</html>
